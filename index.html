<input id="nm" maxlength="12" placeholder="Enter your name" autocomplete="off" spellcheck="false">
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), nameIn = document.getElementById('nm');
const W = 480, H = 720; let SS = 2;   // logical size; the canvas backing store is SS x for crisp, smooth edges
cv.width = W * SS; cv.height = H * SS; ctx.scale(SS, SS); ctx.imageSmoothingQuality = 'high';
const ROAD_L = 125, ROAD_R = 355;
const LANE_X = [(ROAD_L + W / 2) / 2, (ROAD_R + W / 2) / 2];
const BUCKET = 10, TRAILER_CAP = 4, NT = 4;           // tonnes per scoop, scoops per trailer, trailers
const MAX_ORE = BUCKET * TRAILER_CAP * NT, MIN_ORE = BUCKET * 4;
const TRIP = 4000;
// Road centre offset (px) at distance s along the route: winding downhill, then straight highway
const HILL = 4000;
function roadOff(s) {
  if (s <= 0) return 0;

  return 0;
}
let warned = 0, hurtByStock = false, wk = null;
let ret = false;   // false: loaded run out to the Skyway; true: empty return run back to the ROM
const R = TRIP * 4, roadAt = v => roadOff(ret ? R - v : v);   // v is scroll-space; the return run travels the route backwards
const grade = () => ret ? (scroll < CLIMB ? 2 : scroll > R - HILL ? -1 : 0) : (scroll < HILL ? 1 : scroll > R - CLIMB ? -2 : 0);   // +down, -up
// parking bays: big half-oval pull-ins, four on the highway alternating sides (not near the level crossing)
const BAY_L = 640, BAY_D = 190;   // half-oval pull-in: BAY_L along the road, BAY_D deep
const bayStarts = [];

const baySide = b => bayStarts.indexOf(b) % 2 ? -1 : 1;   // alternate sides so only one parking bay is ever on screen
const bayAtS = (v, pad = 0) => bayStarts.some(b => v > b - pad && v < b + BAY_L + pad && Math.abs(b + BAY_L / 2 - crossAt()) > 420);
const onHwy = () => ret ? scroll < R - HILL : scroll >= HILL;
const CLIMB = 1500;   // scroll distance of the steep climb just before the Skyway

const GATE = { x: 960, w: 140 };   // yard entry/exit gap in the bottom fence
const CONT = [{ x: 734, y: 520, w: 46, h: 140, c: '#2f6f9f' }, { x: 826, y: 520, w: 46, h: 140, c: '#b5482f' }];   // sea containers beside the workshop's right end

const BLDG = [[210, 530, 80, 30, 0, 1], [260, 570, 30, 80, -1, 0], [170, 620, 80, 30, 0, -1], [170, 530, 30, 80, 1, 0]].map(([x, y, w, h, nx, ny]) => ({ x, y, w, h, nx, ny, c: '#cfd3d6' }));
// a point/size along a building's yard-facing wall: t = offset along the wall, returns the face centre
const bldgFace = b => ({ px: b.nx > 0 ? b.x + b.w : b.nx < 0 ? b.x : b.x + b.w / 2, py: b.ny > 0 ? b.y + b.h : b.ny < 0 ? b.y : b.y + b.h / 2 });

const faceRect = (b, along, len, d0, d1) => {
  const { px, py } = bldgFace(b);
  return b.ny ? { x: px + along - len / 2, y: b.ny > 0 ? py + d0 : py - d1, w: len, h: d1 - d0 } : { x: b.nx > 0 ? px + d0 : px - d1, y: py + along - len / 2, w: d1 - d0, h: len };
};
const WS_BTN = [10, 70, 170, 34, 'WORKSHOP'];
const TR_W = 76, BUCKET_W = 58, TR_H = BUCKET_W * 3 + 24;   // loading-yard trailer layout: each bin is three loader buckets long
// the road train is parked on a half-moon arc that bulges toward the pile (loaders work on the outside of the curve); u is the distance along it from the cab
const ARC = { cx: 900, cy: 575, R: 300 }, CAB_U = 38, ARC_MID = (CAB_U + NT * TR_H) / 2;
const poseAt = u => { const p = (u - ARC_MID) / ARC.R; return { x: ARC.cx - ARC.R * Math.cos(p), y: ARC.cy + ARC.R * Math.sin(p), a: -p }; };
const trPose = i => poseAt(CAB_U + i * TR_H + TR_H / 2), cabPose = poseAt(0);
const trLoc = (p, x, y) => { const dx = x - p.x, dy = y - p.y, c = Math.cos(p.a), n = Math.sin(p.a); return [dx * c + dy * n, -dx * n + dy * c]; };   // world -> trailer-local (x toward the load side, y along the trailer)
const trWorld = (p, lx, ly) => { const c = Math.cos(p.a), n = Math.sin(p.a); return [p.x + lx * c - ly * n, p.y + lx * n + ly * c]; };
const AI_HOME = { x: 500, y: 860 }, AI_TRAILERS = [2, 3];   // the second loader fills trailers 3 and 4
let ai;
const YARD = { w: 960, h: 1150 };   // the loading yard is bigger than the screen; the top-down view scrolls with the loader

const keys = {};

let stickX = 0;
function padAxis() {
  for (const g of (navigator.getGamepads ? navigator.getGamepads() : [])) {
    if (!g) continue;

}

}
const beaconClock = () => performance.now() / 1000;
function drawBeacon(x, y, phase = 0) {
  const on = Math.sin(beaconClock() * 12 + phase * Math.PI) > 0;
  if (on) {
    const g = ctx.createRadialGradient(x, y, 1, x, y, 16);
    g.addColorStop(0, 'rgba(255,150,0,.7)'); g.addColorStop(1, 'rgba(255,150,0,0)');

function curBtns() { return state === 'load' ? LB : DB; }
function syncBtns() {
  for (const k of ['TL', 'TR', 'TU', 'TD', 'TB', 'TG']) keys[k] = false;
  const b = curBtns();
  for (const k in b) keys[k] = [...ptrs.values()].some(p => !p.stick && inR(p, b[k]));
  const sp = [...ptrs.values()].find(p => p.stick);
  stickX = sp ? (Math.abs(sp.x - STICK.cx) < 8 ? 0 : Math.max(-1, Math.min(1, (sp.x - STICK.cx) / STICK.r))) : 0;
}
function cpos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }

addEventListener('keydown', e => {
  if (e.target === nameIn) { if (e.code === 'Enter') onKey('Enter'); return; }
  keys[e.code] = true;

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = cpos(e);

  if(state==='workshop'&&inR(p,[340,570,132,52])&&workshopParked()){onKey('KeyE');return;}
  if (state === 'workshop' && inR(p, VIEW_BTN)) { chaseView = !chaseView; return; }
  if (state === 'drive' || state === 'workshop' || state === 'ute' || state === 'walk' || state === 'officeinside' || state === 'workshopfoot') { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); syncBtns(); return; }

  }

    for (let i = 0; i < NT; i++) { if (inR(p, lidBtn(i))) toggleLid(i); else if (inR(p, tipBtn(i))) tipTrailer(i); }
    return;
  }
  if (state === 'parkhandover') { if(inR(p,[15,610,450,100])) advanceHandover(); else {cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,p);syncBtns();} return; }

  if (state === 'menu' && inR(p, CAMP_BTN)) { startAtCamp(); return; }
  if (state === 'menu') for (let i = 0; i < DIFFS.length; i++) if (inR(p, diffBtn(i))) { setDiff(i); return; }

});
cv.addEventListener('pointerup', () => { officeTouchHeld = false; });
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons && ptrs.size) { ptrs.clear(); syncBtns(); return; } if (ptrs.has(e.pointerId)) { const n = cpos(e); n.stick = ptrs.get(e.pointerId).stick; ptrs.set(e.pointerId, n); syncBtns(); } });

addEventListener('pointerup', up); addEventListener('pointercancel', up);
cv.addEventListener('lostpointercapture', up);
const touchEnd = e => { if (!e.touches.length) clearInput(); };
addEventListener('touchend', touchEnd); addEventListener('touchcancel', touchEnd);
function clearInput() { ptrs.clear(); for (const k in keys) keys[k] = false; stickX = 0; }
addEventListener('blur', clearInput);
document.addEventListener('visibilitychange', clearInput);
cv.addEventListener('contextmenu', clearInput);
let lastState = null;
cv.addEventListener('contextmenu', e => e.preventDefault());

let state = 'menu', fills, hp, dist, speed, qx, qy, traffic, animals, scroll, spawnT, msg, msgT, score, time, particles, shake, hist, steeringSpeed, tr, rocks, arrivalOre, tons = 0, trip = 1;   // tons: total delivered to the Skyway; trip: 1 or 2
let ldr, carrying, spills = [], pileSeg = [];   // pileSeg: remaining ore (0..1) in each slice of the pile, eaten away by scooping
let shiftStart = false;   // the run began in a camp room: office, then the ute to the truck park, then the truck
let bayReady = 0, bf = null;   // bayReady: -1/1 = parked in a parking bay on that side; bf: fitter visit in progress
let best = +localStorage.oreBest || 0;
let playerName = localStorage.oreName || '', runId = 0;
nameIn.value = playerName;
const DIFFS = [
  { n: 'EASY', spawn: 1.5, dmg: .6, vel: .85, mult: .7 },
  { n: 'NORMAL', spawn: 1, dmg: 1, vel: 1, mult: 1 },
  { n: 'HARD', spawn: .7, dmg: 1.4, vel: 1.15, mult: 1.5 },
  { n: 'KIDS', spawn: 5, dmg: .5, vel: .85, mult: .5, noWildlife: true }];
let diff = [0, 1, 2, 3].includes(+localStorage.oreDiff) && localStorage.oreDiff !== undefined ? +localStorage.oreDiff : 1;
const D = () => DIFFS[diff];
const diffBtn = i => [14 + i * 114, 516, 108, 38, DIFFS[i].n];
function setDiff(i) { diff = (i + DIFFS.length) % DIFFS.length; localStorage.oreDiff = diff; }
let board = [];
try { board = JSON.parse(localStorage.oreBoard || '[]'); } catch (e) { board = []; }
const reached = b => (b.tons ?? (b.done ? 1 : 0)) > 0;
const rank = (a, b) => (reached(b) - reached(a)) || (reached(a) ? ((b.tons ?? 0) - (a.tons ?? 0)) || b.score - a.score : b.pct - a.pct);
// runs that reached the Skyway rank by total tons hauled; runs wrecked before it rank by how far they got
const pctOut = () => tons > 0 ? 100 : Math.min(99, Math.floor(dist / TRIP * 100));
function recordRun(done) {
  if (runId) return;
  runId = Date.now();
  board.push({ id: runId, name: playerName || 'Player', done, diff, score: done ? score : 0, tons, pct: pctOut() });
  board.sort(rank); board = board.slice(0, 50);
  try { localStorage.oreBoard = JSON.stringify(board); } catch (e) {}
  const mine = board.find(b => b.id === runId);
  if (SB_URL && mine) fetch(`${SB_URL}/rest/v1/scores`, { method: 'POST', headers: { ...SB_HEAD, Prefer: 'return=minimal' }, body: JSON.stringify({ run_id: mine.id, name: mine.name, done: mine.done, diff: mine.diff, score: mine.score, tons: mine.tons, pct: mine.pct }) }).then(loadShared).catch(() => {});
}
// Shared scoreboard on Supabase: set the project URL and its public anon key (safe in client code; row-level security limits it to read + insert).
// Leave SB_URL empty to keep scores local. Table setup SQL:
// create table scores (id bigint generated always as identity primary key, run_id bigint not null, name text not null check (char_length(name) between 1 and 12), done boolean not null default false, diff int not null check (diff between 0 and 3), score int not null check (score between 0 and 1000000), tons int not null check (tons between 0 and 1000), pct int not null check (pct between 0 and 100), created_at timestamptz not null default now());
// alter table scores enable row level security;
// create policy "read scores" on scores for select to anon using (true);
// create policy "add scores" on scores for insert to anon with check (true);
const SB_URL = 'https://aaadytlpkdyxfynzvcbe.supabase.co', SB_KEY = 'sb_publishable_eFO6847kDQUsj-nouCFDsw_G5GcUqxw';
const SB_HEAD = { apikey: SB_KEY, 'Content-Type': 'application/json' };
const boardKey = b => `${b.id}|${b.name}`;
async function loadShared() {

const ore = () => Math.round(fills.reduce((a, b) => a + b, 0) * BUCKET);

function reset() {

  runId = 0;
  stickX = 0; tr = Array.from({ length: NT }, () => ({ lid: 0, want: 0, p: 0, dir: 0, hold: 0 })); rocks = []; arrivalOre = 0; tons = 0; trip = 1; fills = [0, 0, 0, 0]; hp = 100; dist = 0; speed = 0; steeringSpeed = 0; qx = LANE_X[0]; qy = 260; traffic = []; animals = [];
  scroll = 0; warned = 0; ret = false; hurtByStock = false; wk = null; spawnT = 0; msg = ''; msgT = 0; score = 0; time = 0; particles = []; shake = 0; hist = [{ s: 0, x: qx }]; train = { ph: 0, t: 0, g: 0, hit: false }; jts = straightChain(qx, qy, 1); cabAngle = 0;
  ldr = { x: 500, y: 290, angle: 0, art: 0 }; pileSeg = Array(SEG_N).fill(1); ldrHp = 100; trDmg = [0, 0, 0, 0]; hitCd = 0; carrying = false; spills = []; aiReset(); ptrs.clear(); syncBtns();
}

function onKey(code) {

    if (state==='workshopfoot' && code==='KeyE') {

const SKIP_BTN = [130, 590, 220, 30, 'SKIP LOADING (L)'], CAMP_BTN = [130, 624, 220, 30, 'START AT CAMP (C)'];

function updateWorkshop(dt) {

  yardUpdate(dt); crewUpdate(dt); trackMarks(); washClock+=dt;

  if (wk.auto && !wk.done && !wk.exitOffered && wk.y >= WK.y + 22 && Math.abs(wk.x-wkBayX(wk.bay))<25) {
    wk.exitOffered = true; wk.v = 0;
    flash('Parked in workshop. Press E to climb out and watch the repairs.');
  }
  const straighten = () => { wk.h = Math.PI + angDiff(wk.h, Math.PI) * (1 - Math.min(1, dt * 6)); };
  if (wk.auto) {
    if (wk.exitOffered && !wk.done) {wk.v=0;return;}
    const cx = wkBayX(wk.bay);
    if (wk.bay === TYRE_BAY && !wk.done) {
      straighten(); wk.x += (cx - wk.x) * Math.min(1, dt * 3);
      if (wk.y < WK_MOUTH - 40) { wk.y += 38 * dt; wkChain(); fitWalk(wk.fit, cx + 19, WK_MOUTH - 70, dt); return; }
      wkChain(); return tyreWork(dt);
    }
    if (wk.bay === TYRE_BAY) { const p = idleSpot(); if (fitWalk(wk.fit, p.x, p.y, dt)) wk.fit.fa = Math.PI / 2; }
    if (!wk.done && !wk.crewReady) { wk.crewReady = wk.crew.every(m => !m.walk); wk.v = 0; return; }   // mechanics hurry over first
    wk.v = wk.done ? Math.min(60, wk.v + 60 * dt) : 38;
    straighten(); wk.x += (cx - wk.x) * Math.min(1, dt * 3);
    wk.y += wk.v * dt; wkChain();
    const ps = wkParts();
    if (!wk.done) {
      ps.forEach((p, k) => {
        if (!wk.fixed[k] && p.y > WK.y + WK.h * .75) {
          wk.fixed[k] = 1; hp = Math.min(100, hp + (100 - wk.hp0) / 5); burst(p.x, p.y, '#9a9a9a', 14);
        }
      });
    }
    if (ps[NT].y > WK_MOUTH + 20) {   // whole rig clear of the building: hand back control to drive out of the yard
      wk.auto = false; if (!wk.done) { wk.done = true; hp = 100; }
      wk.s = 0; flash('All fixed! Drive out through the yard gate');
    }
    return;
  }
  const px = wk.x, py = wk.y, ph = wk.h;
  const up = keys.ArrowUp || keys.KeyW || keys.TG, brake = keys.ArrowDown || keys.KeyS || keys.TB;
  wk.v += (up ? 70 : brake ? -140 : -30) * dt; wk.v = Math.max(0, Math.min(90, wk.v));
  wk.s += (steerAxis() - wk.s) * (1 - Math.exp(-8 * dt));
  wk.h += wk.v / 26 * Math.tan(wk.s * .5) * dt;
  wk.x += Math.sin(wk.h) * wk.v * dt; wk.y -= Math.cos(wk.h) * wk.v * dt; wkChain();

  const crash = why => {
    if (!wk.done) return wkBump(why);
    wk.x = px; wk.y = py; wk.h = ph; wk.v = 0; wkChain(); shake = .2; flash(why);
  };

  const inR = wk.x > WK.x + WK.w + 8 && wk.y > WK.y && wk.y < WK_MOUTH, inT = wk.y < WK.y - 8 && wk.x > WK.x && wk.x < WK.x + WK.w;
  if (!wk.done) { if (inR) wk.lap |= 1; if (inT && wk.lap & 1 && wk.lap !== 15) { wk.lap = 15; flash('Line up straight with a bay, then drive in'); } }

  const fx = wk.x + Math.sin(wk.h) * 14, fy = wk.y - Math.cos(wk.h) * 14;

  if (fx < 8 || fx > WORLD.w - 8 || fy < 8 || fy > WORLD.h - 8) return crash(wk.done ? 'Use the yard gate to leave' : 'Out of the yard! Start again');
  if (wkInside(fx, fy)) {
    if (wk.done) return crash('Crashed into the workshop!');

function update(dt) {
  if (state !== lastState) { lastState = state; if (ptrs.size) { ptrs.clear(); syncBtns(); } }
  if (state !== 'drive' && state !== 'workshop' && state !== 'ute') shake = Math.max(0, shake - dt);   // those three decay it themselves; load/skyway/end screens never did, so a bump kept the screen shaking
  if (state === 'menu') scroll += 70 * dt;
  if (state === 'load') return updateLoad(dt);
  if (state === 'skyway') return updateSkyway(dt);
  if (state === 'parkhandover') return updateParkHandover(dt);
  if (state === 'workshopfoot') return updateWorkshopFoot(dt);
  if (state === 'workshop') return updateWorkshop(dt);
  if (state === 'ute') return updateUte(dt);
  if (state === 'officeinside') return updateOffice(dt);
  if (state === 'walk') return updateWalk(dt);
  if (state !== 'drive') return;
  time += dt;
  if (bf) {
    const tw = BF.arrive + BF.out + BF.walk, was = bf.t;
    bf.t += dt;
    if (bf.t > tw && bf.t < tw + BF.work) hp = Math.min(100, bf.hp0 + (100 - bf.hp0) * (bf.t - tw) / BF.work);
    if (was < tw + BF.work && bf.t >= tw + BF.work) { hp = 100; hurtByStock = false; flash('Repaired!'); }
    if (bf.t >= BF_END) bf = null;
  }
  const lf = 1 - (ore() / MAX_ORE) * .45;
  const gr = grade(), down = gr > 0;
  const maxSpeed = down ? 400 : Math.min(180, 220 * lf + 50);   // 180 px/s shows as 90 km/h; no limit rolling downhill
  const climb = gr === -2;
  if (keys.ArrowUp || keys.KeyW || keys.TG) speed += 120 * lf * (climb ? .5 : 1) * dt;
  else if (keys.ArrowDown || keys.KeyS || keys.TB) speed -= 220 * dt;
  else speed += (gr === 2 ? 70 : down ? 45 : climb ? -90 : -40) * dt;   // coasting downhill builds momentum, uphill loses it
  if (down && speed > 120 && !(keys.ArrowDown || keys.KeyS || keys.TB)) speed += (speed - 120) * .12 * dt;
  speed = Math.max(0, speed);
  if (speed > maxSpeed) speed = Math.max(maxSpeed, speed - 160 * dt);
  if (climb) { const cap = 30 + 90 * lf; if (speed > cap) speed = Math.max(cap, speed - 100 * dt); }
  // no overtaking: can't outrun same-direction traffic ahead
  for (const t of traffic) {
    if (t.oncoming || t.hit || t.y > qy || Math.abs(t.x - qx) > 50) continue;
    if (qy - 22 - (t.y + t.h / 2) < 12) speed = Math.min(speed, t.v);
  }
  if (bf) speed = 0;
  const steer = bf ? 0 : steerAxis();
  const targetSteeringSpeed = steer * (100 + 70 * lf) * Math.min(1, speed / 40);
  steeringSpeed += (targetSteeringSpeed - steeringSpeed) * (1 - Math.exp(-8 * dt));
  qx += steeringSpeed * dt;
  qx = Math.max(30, Math.min(W - 30, qx));
  bayReady = bf ? 0 : rigInBay();
  const ro0 = roadAt(scroll);
  if ((qx < ROAD_L + ro0 - 10 || qx > ROAD_R + ro0 + 10) && speed > 90 && !bayAtS(scroll)) speed -= 200 * dt;
  if (!ret && warned < 1 && scroll > HILL) { warned = 1; flash('Highway! Dodge traffic, cows & kangaroos'); }
  else if (!ret && warned < 2 && scroll > R - CLIMB - 300) { warned = 2; flash('Steep climb ahead!'); }
  else if (ret && warned < 1 && scroll > CLIMB) { warned = 1; flash('Highway! Dodge traffic, cows & kangaroos'); }
  else if (ret && warned < 2 && scroll > R - HILL) { warned = 2; flash('Uphill to the ROM - keep the throttle on'); }

  dist += speed * dt / 4; scroll += speed * dt;
  // ground slides back under the trailers; the cab leans into its steering and drags the chain after it
  for (const j of jts) j.y += speed * dt;
  cabAngle = Math.atan2(steeringSpeed, Math.max(speed, 60));
  jts[0].x = qx - Math.sin(cabAngle) * HITCH; jts[0].y = qy + Math.cos(cabAngle) * HITCH;
  chainFollow(jts, TRAILER_LEN);
  spawnT -= dt;
  if (spawnT <= 0) {
    const cy = crossY();
    if (onHwy() && !(cy > -260 && cy < H + 80)) spawn();
    spawnT = onSkywayIncline()
      ? 14 + Math.random() * 16
      : Math.max(.45, 1.3 - dist / TRIP * .7) *
        (0.7 + Math.random() * .6) * D().spawn;
  }

  if (onSkywayIncline()) {
    animals = [];
    traffic = traffic.filter(t => t.pinkQuad);
  }

  for (const t of traffic) {
    t.y += (speed - t.v) * dt; t.x = t.lx + roadAt(scroll + qy - t.y);
  }
  for (const a of animals) {
    a.y += speed * dt;
    if (a.hit) { a.x += a.fvx * dt; a.y += a.fvy * dt; a.fvx *= 1 - Math.min(1, dt * 1.5); a.fvy *= 1 - Math.min(1, dt * 1.5); a.rot += a.fw * dt; a.fw *= 1 - Math.min(1, dt * 1.2); a.t += dt; }

    const p = o.type ? (hit(parts[0], o) ? parts[0] : null) : parts.find(p => hit(p, o)); if (!p) continue;
    o.hit = true;
    if (o.type) {
      const side = o.x < qx ? -1 : 1;
      Object.assign(o, { fvx: side * (90 + speed * .5), fvy: -(60 + speed * .6), fw: side * (7 + Math.random() * 4), rot: 0, t: 0 });
      burst(o.x, o.y, o.type === 'cow' ? o.col : '#c8895a', 12);
      damage(o.type === 'cow' ? 30 : 15, `${o.type === 'cow' ? 'Cow collision' : 'Kangaroo strike'}! ${isTouch ? 'Tap WORKSHOP' : 'H = workshop'}`, p.idx);
      speed *= .4; hurtByStock = true;

    if (state === 'over') break;
  }
  updateTrain(dt, parts);
  traffic = traffic.filter(t => t.y < H + 120 && t.y > -300);
  animals = animals.filter(a => a.y < H + 60 && a.x > -80 && a.x < W + 80 && !(a.hit && a.t > 1.8));

  if (state === 'drive' && ret && dist >= TRIP) {
    startSecondLoad(); return;
  } else if (state === 'drive' && !ret && dist >= TRIP) {
    state = 'skyway'; arrivalOre = ore(); tons += arrivalOre; speed = 0; particles = []; ptrs.clear(); syncBtns();

  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.l -= dt; }
  particles = particles.filter(p => p.l > 0);
  shake = Math.max(0, shake - dt); msgT -= dt;
}

// road is drawn as smooth paths (not pixel strips) so the curves don't shimmer while scrolling
const roadX = y => state === 'ute' || state === 'uteend' ? uOff(us + UTE_Y - y) : roadAt(scroll + qy - y);

// ---------- pseudo-3D driving view ----------
// World coords stay 2D (x across, y down the screen); a perspective camera projects them with a height axis z.
// `fr` rotates primitives about a point so the cab, trailers and tossed animals can be drawn at any heading.
const HOR = 92, CAM_Y = H + 400;
const uOf = y => (y + 120) / (H + 120);

const P = (x, y, z = 0) => {

function shade(c, f) {

  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);

  ctx.stroke();
}
