<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ore Hauler: Loader & Side-Tippers</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
  #wrap{display:flex;justify-content:center;align-items:center;height:100%}
  canvas{background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;max-height:100vh;max-width:100vw;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const ROAD_L = 125, ROAD_R = 355;
const LANE_X = [(ROAD_L + W / 2) / 2, (ROAD_R + W / 2) / 2];
const BUCKET = 6, TRAILER_CAP = 5, NT = 4;           // tonnes per scoop, scoops per trailer, trailers
const MAX_ORE = BUCKET * TRAILER_CAP * NT, MIN_ORE = BUCKET * 4;
const TRIP = 6000;
const TR_Y0 = 100, TR_H = 108, TR_X = 330, TR_W = 76;   // loading-yard trailer layout
const PILE = { x: 20, y: 230, w: 170, h: 270 };
const OFF = i => 57 + i * 62;                           // trailer distance behind cab centre when driving

const keys = {};
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const DB = { TL: [10, 650, 80, 60, '◀'], TR: [100, 650, 80, 60, '▶'], TB: [300, 650, 80, 60, 'BRAKE'], TG: [390, 650, 80, 60, 'GAS'] };
const LB = { TL: [10, 640, 80, 70, '◀'], TR: [100, 640, 80, 70, '▶'], TD: [290, 640, 80, 70, 'REV'], TU: [390, 640, 80, 70, 'GAS'] };
const ACT = [338, 565, 132, 60, 'SCOOP / DUMP'];
const GO = [140, 580, 180, 50, 'START DRIVING'];
const ptrs = new Map();
const inR = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];
function curBtns() { return state === 'load' ? LB : DB; }
function syncBtns() {
  for (const k of ['TL', 'TR', 'TU', 'TD', 'TB', 'TG']) keys[k] = false;
  const b = curBtns();
  for (const k in b) keys[k] = [...ptrs.values()].some(p => inR(p, b[k]));
}
function cpos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = cpos(e);
  if (state === 'drive') { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); syncBtns(); return; }
  if (state === 'load') {
    if (ore() >= MIN_ORE && inR(p, GO)) start();
    else if (inR(p, ACT)) action();
    else { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); syncBtns(); }
    return;
  }
  onKey('Space');
});
cv.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, cpos(e)); syncBtns(); } });
const up = e => { ptrs.delete(e.pointerId); syncBtns(); };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
cv.addEventListener('lostpointercapture', up);
addEventListener('blur', () => { ptrs.clear(); for (const k in keys) keys[k] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

let state = 'menu', fills, hp, dist, speed, qx, qy, traffic, animals, scroll, spawnT, msg, msgT, score, time, particles, shake, hist, steeringSpeed;
let ldr, carrying;
let best = +localStorage.oreBest || 0;
const ore = () => fills.reduce((a, b) => a + b, 0) * BUCKET;

function reset() {
  fills = [0, 0, 0, 0]; hp = 100; dist = 0; speed = 0; steeringSpeed = 0; qx = LANE_X[0]; qy = 260; traffic = []; animals = [];
  scroll = 0; spawnT = 0; msg = ''; msgT = 0; score = 0; time = 0; particles = []; shake = 0; hist = [{ s: 0, x: qx }];
  ldr = { x: 250, y: 600, angle: 0 }; carrying = false; ptrs.clear(); syncBtns();
}
reset();

function onKey(code) {
  if (state === 'menu' && (code === 'Space' || code === 'Enter')) { reset(); state = 'load'; flash('Scoop ore from the pile, dump it in the trailers'); return; }
  if (state === 'load') {
    if (code === 'Space') action();
    else if ((code === 'Enter' || code === 'KeyG') && ore() >= MIN_ORE) start();
    return;
  }
  if ((state === 'over' || state === 'win') && (code === 'Space' || code === 'Enter')) { reset(); state = 'menu'; }
}
function start() { state = 'drive'; ptrs.clear(); syncBtns(); flash('Go! Dodge traffic & livestock'); }
function flash(t) { msg = t; msgT = 2.5; }
function burst(x, y, col, n) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 120, vy: (Math.random() - .8) * 120, l: .6, col }); }

const nearPile = () => ldr.x > PILE.x - 40 && ldr.x < PILE.x + PILE.w + 40 && ldr.y > PILE.y - 40 && ldr.y < PILE.y + PILE.h + 40;
const trailerAt = () => { const i = Math.floor((ldr.y - TR_Y0) / TR_H); return ldr.x > TR_X - 100 && i >= 0 && i < NT ? i : -1; };
function action() {
  if (!carrying) {
    if (nearPile()) { carrying = true; burst(ldr.x + Math.sin(ldr.angle) * 30, ldr.y - Math.cos(ldr.angle) * 30, '#8a5a44', 6); } else flash('Drive up to the ore pile to scoop');
  } else {
    const i = trailerAt();
    if (i < 0) flash('Line up beside a trailer to dump');
    else if (fills[i] >= TRAILER_CAP) flash(`Trailer ${i + 1} is full`);
    else { fills[i]++; carrying = false; burst(TR_X + TR_W / 2, TR_Y0 + i * TR_H + TR_H / 2, '#a8705a', 8); }
  }
}

function spawn() {
  if (Math.random() < .6) {
    const lane = Math.floor(Math.random() * LANE_X.length), oncoming = lane === 1;
    const col = ['#c33', '#36c', '#ccc', '#e8b100', '#3a3'][Math.floor(Math.random() * 5)];
    const truck = Math.random() < .25;
    traffic.push({ x: LANE_X[lane], y: -100, w: 34, h: truck ? 90 : 56, v: oncoming ? -110 : 40 + Math.random() * 40, col, truck, oncoming });
  } else {
    const dir = Math.random() < .5 ? 1 : -1;
    animals.push({ x: dir > 0 ? ROAD_L - 40 : ROAD_R + 40, y: -40, dir, w: 44, h: 28, type: Math.random() < .5 ? 'cow' : 'sheep', vx: 35 + Math.random() * 25, ph: 0 });
  }
}

const hit = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 3 && Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 3;
function sampleX(s) {
  if (s <= hist[0].s) return hist[0].x;
  for (let i = hist.length - 1; i > 0; i--) if (hist[i - 1].s <= s) {
    const a = hist[i - 1], b = hist[i], f = b.s === a.s ? 0 : (s - a.s) / (b.s - a.s);
    return a.x + (b.x - a.x) * Math.min(1, f);
  }
  return hist[0].x;
}
const trailerX = i => sampleX(scroll - OFF(i) * .3);

function damage(n, what, idx) {
  hp -= n; shake = .3; flash(what);
  if (idx >= 0) fills[idx] = Math.max(0, Math.round(fills[idx] * .6 - .2)); else for (let i = 0; i < NT; i++) fills[i] = Math.max(0, fills[i] - (Math.random() < .3 ? 1 : 0));
  burst(qx, qy + (idx >= 0 ? OFF(idx) : 0), '#8a5a44', 10);
  if (hp <= 0) { hp = 0; state = 'over'; }
}

function updateLoad(dt) {
  const steering = (keys.ArrowRight || keys.KeyD || keys.TR ? 1 : 0) - (keys.ArrowLeft || keys.KeyA || keys.TL ? 1 : 0);
  const throttle = (keys.ArrowUp || keys.KeyW || keys.TU ? 1 : 0) - (keys.ArrowDown || keys.KeyS || keys.TD ? 1 : 0);
  ldr.angle += steering * 2 * dt;
  const distance = throttle * (carrying ? 120 : 160) * dt;
  ldr.x = Math.max(25, Math.min(W - 25, ldr.x + Math.sin(ldr.angle) * distance));
  ldr.y = Math.max(85, Math.min(H - 100, ldr.y - Math.cos(ldr.angle) * distance));
  if (ldr.x > TR_X - 36 && ldr.y < TR_Y0 + NT * TR_H + 20) ldr.x = TR_X - 36; // trailers block the way
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.l -= dt; }
  particles = particles.filter(p => p.l > 0); msgT -= dt;
}

function update(dt) {
  if (state === 'load') return updateLoad(dt);
  if (state !== 'drive') return;
  time += dt;
  const lf = 1 - (ore() / MAX_ORE) * .45;
  const maxSpeed = 220 * lf + 50;
  if (keys.ArrowUp || keys.KeyW || keys.TG) speed += 120 * lf * dt;
  else if (keys.ArrowDown || keys.KeyS || keys.TB) speed -= 220 * dt;
  else speed -= 40 * dt;
  speed = Math.max(0, Math.min(maxSpeed, speed));
  const steer = (keys.ArrowLeft || keys.KeyA || keys.TL ? -1 : 0) + (keys.ArrowRight || keys.KeyD || keys.TR ? 1 : 0);
  const targetSteeringSpeed = steer * (100 + 70 * lf) * Math.min(1, speed / 40);
  steeringSpeed += (targetSteeringSpeed - steeringSpeed) * (1 - Math.exp(-8 * dt));
  qx += steeringSpeed * dt;
  qx = Math.max(30, Math.min(W - 30, qx));
  if ((qx < ROAD_L - 10 || qx > ROAD_R + 10) && speed > 90) speed -= 200 * dt;

  dist += speed * dt / 4; scroll += speed * dt;
  if (speed > 0) { hist.push({ s: scroll, x: qx }); while (hist.length > 2 && hist[1].s < scroll - 400) hist.shift(); }
  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(.45, 1.3 - dist / TRIP * .7) * (0.7 + Math.random() * .6); }

  for (const t of traffic) t.y += (speed - t.v) * dt;
  for (const a of animals) { a.y += speed * dt; a.x += a.dir * a.vx * dt; a.ph += dt * 8; }
  const parts = [{ x: qx, y: qy, w: 30, h: 44, idx: -1 }];
  for (let i = 0; i < NT; i++) parts.push({ x: trailerX(i), y: qy + OFF(i), w: 34, h: 54, idx: i });
  for (const o of [...traffic, ...animals]) {
    if (o.hit) continue;
    const p = parts.find(p => hit(p, o)); if (!p) continue;
    o.hit = true;
    if (o.type) damage(o.type === 'cow' ? 30 : 15, 'Livestock collision!', p.idx), speed *= .4;
    else damage(25, p.idx < 0 ? 'Hit a vehicle!' : `Trailer ${p.idx + 1} clipped!`, p.idx), speed *= .3;
    if (state === 'over') break;
  }
  traffic = traffic.filter(t => t.y < H + 120 && t.y > -300);
  animals = animals.filter(a => a.y < H + 60 && a.x > -80 && a.x < W + 80);

  if (state === 'drive' && dist >= TRIP) {
    score = Math.round(ore() * 10 + hp * 5 + Math.max(0, 300 - time) * 2);
    if (score > best) { best = score; localStorage.oreBest = best; }
    state = 'win'; ptrs.clear(); syncBtns();
  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.l -= dt; }
  particles = particles.filter(p => p.l > 0);
  shake = Math.max(0, shake - dt); msgT -= dt;
}

// ---------- drawing ----------
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function text(s, x, y, size = 18, col = '#fff', align = 'center') {
  ctx.fillStyle = col; ctx.font = `bold ${size}px system-ui,sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
}
function bar(x, y, w, h, f, col) { rect(x, y, w, h, '#000a'); rect(x + 2, y + 2, (w - 4) * Math.max(0, Math.min(1, f)), h - 4, col); }
function drawBtn(r, label, on) {
  ctx.globalAlpha = on ? .8 : .5; rect(r[0], r[1], r[2], r[3], '#000');
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(r[0], r[1], r[2], r[3]); ctx.globalAlpha = 1;
  text(label, r[0] + r[2] / 2, r[1] + r[3] / 2 + 6, label.length > 1 ? 15 : 26);
}
function drawBtns(set) { for (const k in set) drawBtn(set[k], set[k][4], keys[k]); }

function drawRoad() {
  rect(0, 0, W, H, '#a74626');
  for (let y = -160 + (scroll % 160); y < H + 100; y += 160) {
    for (const x of [35, W - 50]) {
      ctx.fillStyle = '#87351e'; ctx.beginPath(); ctx.ellipse(x, y + 35, 29, 17, -.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#bc5b31'; ctx.beginPath(); ctx.ellipse(x - 5, y + 30, 23, 11, -.3, 0, Math.PI * 2); ctx.fill();
    }
    for (const x of [75, W - 80]) {
      ctx.fillStyle = '#77713b'; ctx.beginPath(); ctx.arc(x, y + 102, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a4a063'; ctx.beginPath(); ctx.arc(x - 3, y + 99, 7, 0, Math.PI * 2); ctx.fill();
    }
  }
  rect(ROAD_L - 13, 0, ROAD_R - ROAD_L + 26, H, '#bf7044');
  rect(ROAD_L, 0, ROAD_R - ROAD_L, H, '#514f4b');
  for (let y = -70 + (scroll % 70); y < H; y += 70) rect(W / 2 - 2, y, 4, 34, '#eee8d5');
  rect(ROAD_L + 2, 0, 3, H, '#eee8d5'); rect(ROAD_R - 5, 0, 3, H, '#eee8d5');
  for (let y = -160 + (scroll % 160); y < H; y += 160) {
    rect(ROAD_L - 20, y, 4, 15, '#eee8d5'); rect(ROAD_R + 16, y, 4, 15, '#eee8d5');
    rect(ROAD_L - 20, y + 3, 4, 4, '#d33'); rect(ROAD_R + 16, y + 3, 4, 4, '#d33');
  }
}
function drawCar(t) {
  ctx.save(); ctx.translate(t.x, t.y);
  if (t.oncoming) ctx.rotate(Math.PI);
  const x = -t.w / 2, y = -t.h / 2;
  rect(x, y, t.w, t.h, t.col);
  rect(x + 4, y + 6, t.w - 8, 12, '#9cf');
  if (t.truck) rect(x + 2, y + 24, t.w - 4, t.h - 28, '#ddd');
  rect(x + 3, y + t.h - 4, 8, 3, '#f33'); rect(x + t.w - 11, y + t.h - 4, 8, 3, '#f33');
  ctx.restore();
}
function drawAnimal(a) {
  ctx.save(); ctx.translate(a.x, a.y); ctx.scale(a.dir, 1);
  const cow = a.type === 'cow';
  rect(-20, -10, 32, 20, cow ? '#fff' : '#eee');
  if (cow) { rect(-14, -8, 9, 8, '#222'); rect(2, 0, 8, 8, '#222'); }
  rect(12, -8, 12, 12, cow ? '#fff' : '#333');
  rect(20, -6, 2, 2, cow ? '#000' : '#fff');
  const s = Math.sin(a.ph) * 3;
  rect(-16, 10, 4, 8 + s, '#222'); rect(-4, 10, 4, 8 - s, '#222'); rect(4, 10, 4, 8 + s, '#222'); rect(8, 10, 4, 8 - s, '#222');
  ctx.restore();
}
// side-tipper trailer, top-down, centred on (x,y); w x h; fill 0..1; tipSide hinge on right
function drawTrailer(x, y, w, h, fill, num) {
  rect(x - w / 2 - 3, y - h / 2 + 6, 5, 14, '#111'); rect(x - w / 2 - 3, y + h / 2 - 20, 5, 14, '#111');
  rect(x + w / 2 - 2, y - h / 2 + 6, 5, 14, '#111'); rect(x + w / 2 - 2, y + h / 2 - 20, 5, 14, '#111');
  rect(x - w / 2, y - h / 2, w, h, '#ee5c9d');
  rect(x - w / 2 + 3, y - h / 2 + 3, w - 6, h - 6, '#b73770');
  if (fill > 0) {
    const ih = (h - 10) * Math.min(1, .25 + fill * .75);
    rect(x - w / 2 + 5, y - ih / 2, w - 10, ih, '#8a5a44');
    rect(x - w / 2 + 9, y - ih / 2 + 3, w - 18, Math.max(2, ih - 6), '#a8705a');
  }
  rect(x + w / 2 - 3, y - h / 2, 3, h, '#e8b100');               // tipping hinge rail
  if (num) text(String(num), x - w / 2 + 12, y - h / 2 + 16, 12, '#ccd');
}
function drawCab(x, y) {
  rect(x - 19, y - 14, 5, 14, '#111'); rect(x + 14, y - 14, 5, 14, '#111');
  rect(x - 15, y - 22, 30, 44, '#f062a4'); rect(x - 12, y - 18, 24, 12, '#9cf'); rect(x - 12, y - 2, 24, 18, '#c43879');
}
function drawTruck() {
  ctx.strokeStyle = '#312d2c'; ctx.lineWidth = 4;
  for (let i = 0; i < NT; i++) {
    ctx.beginPath();
    ctx.moveTo(i === 0 ? qx : trailerX(i - 1), i === 0 ? qy + 22 : qy + OFF(i - 1) + 28);
    ctx.lineTo(trailerX(i), qy + OFF(i) - 28); ctx.stroke();
  }
  for (let i = NT - 1; i >= 0; i--) { const tx = trailerX(i); drawTrailer(tx, qy + OFF(i), 34, 56, fills[i] / TRAILER_CAP, 0); }
  drawCab(qx, qy);
}
function drawLoader(x, y, loaded) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ldr.angle); ctx.translate(-x, -y);
  rect(x - 22, y - 12, 9, 18, '#111'); rect(x + 13, y - 12, 9, 18, '#111'); rect(x - 22, y + 10, 9, 18, '#111'); rect(x + 13, y + 10, 9, 18, '#111');
  rect(x - 14, y - 10, 28, 42, '#f2b200');
  rect(x - 10, y + 4, 20, 14, '#333'); rect(x - 8, y + 6, 16, 8, '#9cf');
  rect(x - 3, y - 26, 6, 18, '#d49a00');
  rect(x - 25, y - 38, 50, 14, '#777');
  if (loaded) { rect(x - 21, y - 44, 42, 12, '#8a5a44'); rect(x - 15, y - 48, 30, 6, '#a8705a'); }
  ctx.restore();
}
function drawYard() {
  rect(0, 0, W, H, '#a74626');
  for (let i = 0; i < 30; i++) rect((i * 97) % W, (i * 61) % H, 6, 6, '#85371f');
  ctx.fillStyle = '#7a4a38'; ctx.beginPath(); ctx.ellipse(PILE.x + PILE.w / 2, PILE.y + PILE.h / 2, PILE.w / 2, PILE.h / 2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#9a6a55'; ctx.beginPath(); ctx.ellipse(PILE.x + PILE.w / 2 + 10, PILE.y + PILE.h / 2 - 20, PILE.w / 3, PILE.h / 3, 0, 0, 7); ctx.fill();
  text('IRON ORE', PILE.x + PILE.w / 2, PILE.y + PILE.h / 2 + 5, 16, '#fff');
  drawCab(TR_X + TR_W / 2 - 1, TR_Y0 - 38);
  for (let i = 0; i < NT; i++) {
    const cy = TR_Y0 + i * TR_H + TR_H / 2;
    rect(TR_X + TR_W / 2 - 3, cy - TR_H / 2 - 12, 6, 12, '#444');
    drawTrailer(TR_X + TR_W / 2, cy, TR_W, TR_H - 14, fills[i] / TRAILER_CAP, i + 1);
    text(`${fills[i] * BUCKET}/${TRAILER_CAP * BUCKET}t`, TR_X + TR_W / 2, cy + 6, 13, '#fff');
    if (trailerAt() === i && carrying) { ctx.strokeStyle = '#ff6'; ctx.lineWidth = 3; ctx.strokeRect(TR_X - 2, cy - TR_H / 2 + 5, TR_W + 4, TR_H - 10); }
  }
  drawLoader(ldr.x, ldr.y, carrying);
  for (const p of particles) rect(p.x, p.y, 4, 4, p.col);
  rect(0, 0, W, 56, '#000a');
  text('FRONT-END LOADER', 12, 24, 18, '#f2b200', 'left');
  text(`Loaded: ${ore()} / ${MAX_ORE} t`, 12, 46, 13, '#ddd', 'left');
  text(carrying ? 'Bucket full: dump it in a trailer' : nearPile() ? 'At the pile: SCOOP' : 'Drive to the pile', W - 12, 24, 13, '#ff6', 'right');
  text(isTouch ? 'Hold ◀/▶ to turn · GAS / REV to move' : '←→ turn · ↑↓ move · SPACE scoop/dump', W - 12, 46, 12, '#ccc', 'right');
  if (msgT > 0) text(msg, W / 2, 90, 15, '#ff6');
  if (ore() >= MIN_ORE) { if (isTouch) drawBtn(GO, GO[4], false); else text('Press G / Enter to start driving', W / 2, 620, 18, '#ff6'); }
  else text(`Load at least ${MIN_ORE} t to depart`, W / 2, isTouch ? 615 : 620, 14, '#bbb');
  if (isTouch) { drawBtns(LB); drawBtn(ACT, ACT[4], false); }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  if (state === 'load') drawYard();
  else if (state === 'menu') {
    drawRoad();
    drawCab(W / 2, 360); for (let i = 0; i < NT; i++) drawTrailer(W / 2, 360 + OFF(i), 34, 56, .8, 0);
    rect(40, 70, W - 80, 180, '#000b');
    text('ORE HAULER', W / 2, 130, 44, '#f60');
    text('Loader + 4 Side-Tippers', W / 2, 165, 20);
    text('Load the trailers, haul the ore, dodge traffic & livestock', W / 2, 205, 13, '#ddd');
    text(isTouch ? 'Tap to start' : 'Press SPACE to start', W / 2, 580, 22, '#ff6');
    text('↑/W throttle   ↓/S brake   ←→/A D steer', W / 2, 620, 14, '#ccc');
    text(`Best: ${best}`, W / 2, 650, 14, '#ccc');
  } else {
    drawRoad();
    for (const a of animals) drawAnimal(a);
    for (const t of traffic) drawCar(t);
    drawTruck();
    for (const p of particles) rect(p.x, p.y, 4, 4, p.col);
    rect(0, 0, W, 64, '#000a');
    text('HP', 10, 20, 12, '#fff', 'left'); bar(34, 8, 140, 16, hp / 100, hp > 40 ? '#4c4' : '#e44');
    text('ORE', 10, 48, 12, '#fff', 'left'); bar(40, 36, 134, 16, ore() / MAX_ORE, '#c86');
    text(`${Math.round(speed * .5)} km/h`, W - 10, 22, 16, '#fff', 'right');
    text(`${Math.min(100, Math.round(dist / TRIP * 100))}% to depot`, W - 10, 48, 14, '#ff6', 'right');
    if (isTouch && state === 'drive') drawBtns(DB);
    if (msgT > 0) text(msg, W / 2, 110, 22, '#ff6');
    if (state === 'over' || state === 'win') {
      rect(40, 220, W - 80, 240, '#000d');
      if (state === 'over') { text('WRECKED!', W / 2, 280, 40, '#e44'); text('The truck is out of action.', W / 2, 320, 18); }
      else {
        text('DELIVERED!', W / 2, 275, 40, '#4c4');
        text(`Side-tipped ${ore()} t in ${Math.round(time)}s`, W / 2, 315, 18);
        text(`Score: ${score}`, W / 2, 350, 24, '#ff6'); text(`Best: ${best}`, W / 2, 380, 16);
      }
      text(isTouch ? 'Tap to play again' : 'Press SPACE to play again', W / 2, 430, 18, '#ff6');
    }
  }
  ctx.restore();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
