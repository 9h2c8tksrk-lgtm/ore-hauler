<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Let's Haul</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
  #wrap{display:flex;justify-content:center;align-items:center;height:100%}
  #nm{position:fixed;display:none;box-sizing:border-box;text-align:center;font-weight:bold;font-family:system-ui,sans-serif;background:#000c;color:#ff6;border:2px solid #fff;border-radius:6px;outline:none}
  canvas{background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;max-height:100vh;max-width:100vw;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<input id="nm" maxlength="12" placeholder="Enter your name" autocomplete="off" spellcheck="false">
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), nameIn = document.getElementById('nm');
const W = cv.width, H = cv.height;
const ROAD_L = 125, ROAD_R = 355;
const LANE_X = [(ROAD_L + W / 2) / 2, (ROAD_R + W / 2) / 2];
const BUCKET = 6, TRAILER_CAP = 5, NT = 4;           // tonnes per scoop, scoops per trailer, trailers
const MAX_ORE = BUCKET * TRAILER_CAP * NT, MIN_ORE = BUCKET * 4;
const TRIP = 4000;
// Road centre offset (px) at distance s along the route: winding downhill, then straight highway
const HILL = 4000;
function roadOff(s) {
  if (s <= 0) return 0;
  if (s < HILL) return 75 * Math.min(1, s / 500) * Math.sin(2 * Math.PI * s / (HILL / 3));
  return 0;
}
let warned = 0, hurtByStock = false, wk = null;
let ret = false;   // false: loaded run out to the Skyway; true: empty return run back to the ROM
const R = TRIP * 4, roadAt = v => roadOff(ret ? R - v : v);   // v is scroll-space; the return run travels the route backwards
const grade = () => ret ? (scroll < CLIMB ? 2 : scroll > R - HILL ? -1 : 0) : (scroll < HILL ? 1 : scroll > R - CLIMB ? -2 : 0);   // +down, -up
const onHwy = () => ret ? scroll < R - HILL : scroll >= HILL;
const CLIMB = 1500;   // scroll distance of the steep climb just before the Skyway
const WORLD = { w: 1100, h: 1500 };   // workshop yard is larger than the screen; the camera follows the truck
const WK = { x: 330, y: 520, w: 396, h: 150 }, BAY_W = 66, WK_SC = .62;   // workshop building, six bays across; trucks drive in at the top and out at the bottom
const GATE = { x: 960, w: 140 };   // yard entry/exit gap in the bottom fence
const CONT = [{ x: 734, y: 520, w: 46, h: 140, c: '#2f6f9f' }, { x: 826, y: 520, w: 46, h: 140, c: '#b5482f' }];   // sea containers beside the workshop's right end
const SHELTER = { x: 780, y: 520, w: 46, h: 140 };   // arched shelter between them
const WS_BTN = [10, 70, 170, 34, 'WORKSHOP'];
const TR_Y0 = 100, TR_H = 108, TR_X = 330, TR_W = 76;   // loading-yard trailer layout
const PILE = { x: 30, y: 130, w: 80, h: 350 };   // long finger pile; solid for the loader
const LDR_R = 30;
const OFF = i => 57 + i * 62;                           // trailer distance behind cab centre when driving

const keys = {};
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const DB = { TB: [300, 650, 80, 60, 'BRAKE'], TG: [390, 650, 80, 60, 'GAS'] };
const LB = { TD: [290, 640, 80, 70, 'REV'], TU: [390, 640, 80, 70, 'GAS'] };
const ACT = [338, 565, 132, 60, 'SCOOP / DUMP'];
const GO = [140, 580, 180, 50, 'START DRIVING'];
const ptrs = new Map();
const inR = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];
const STICK = { cx: 80, cy: 678, r: 52, zone: [0, 600, 210, 120] };
let stickX = 0;
function padAxis() {
  for (const g of (navigator.getGamepads ? navigator.getGamepads() : [])) {
    if (!g) continue;
    const v = Math.abs(g.axes[0]) > .15 ? g.axes[0] : (g.buttons[15]?.pressed ? 1 : 0) - (g.buttons[14]?.pressed ? 1 : 0);
    if (v) return Math.max(-1, Math.min(1, v));
  }
  return 0;
}
function steerAxis() {
  const kb = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  return stickX || padAxis() || kb;
}
const beaconClock = () => performance.now() / 1000;
function drawBeacon(x, y, phase = 0) {
  const on = Math.sin(beaconClock() * 12 + phase * Math.PI) > 0;
  if (on) {
    const g = ctx.createRadialGradient(x, y, 1, x, y, 16);
    g.addColorStop(0, 'rgba(255,150,0,.7)'); g.addColorStop(1, 'rgba(255,150,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = on ? '#ffa020' : '#7a4200'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
}
function curBtns() { return state === 'load' ? LB : DB; }
function syncBtns() {
  for (const k of ['TL', 'TR', 'TU', 'TD', 'TB', 'TG']) keys[k] = false;
  const b = curBtns();
  for (const k in b) keys[k] = [...ptrs.values()].some(p => !p.stick && inR(p, b[k]));
  const sp = [...ptrs.values()].find(p => p.stick);
  stickX = sp ? (Math.abs(sp.x - STICK.cx) < 8 ? 0 : Math.max(-1, Math.min(1, (sp.x - STICK.cx) / STICK.r))) : 0;
}
function cpos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }

addEventListener('keydown', e => {
  if (e.target === nameIn) { if (e.code === 'Enter') onKey('Enter'); return; }
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = cpos(e);
  if ((state === 'drive' || state === 'load' || state === 'workshop') && inR(p, STICK.zone)) { p.stick = true; cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); syncBtns(); return; }
  if (state === 'drive' && hurtByStock && inR(p, WS_BTN)) { toWorkshop(); return; }
  if (state === 'drive' || state === 'workshop') { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); syncBtns(); return; }
  if (state === 'load') {
    if (ore() >= MIN_ORE && inR(p, GO)) start();
    else if (inR(p, ACT)) action();
    else { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, p); syncBtns(); }
    return;
  }
  if (state === 'skyway') {
    for (let i = 0; i < NT; i++) { if (inR(p, lidBtn(i))) toggleLid(i); else if (inR(p, tipBtn(i))) tipTrailer(i); }
    return;
  }
  if (state === 'menu') for (let i = 0; i < DIFFS.length; i++) if (inR(p, diffBtn(i))) { setDiff(i); return; }
  onKey('Space');
});
cv.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { const n = cpos(e); n.stick = ptrs.get(e.pointerId).stick; ptrs.set(e.pointerId, n); syncBtns(); } });
const up = e => { ptrs.delete(e.pointerId); syncBtns(); };
addEventListener('pointerup', up); addEventListener('pointercancel', up);
cv.addEventListener('lostpointercapture', up);
addEventListener('blur', () => { ptrs.clear(); for (const k in keys) keys[k] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

let straddleT = 0, state = 'menu', fills, hp, dist, speed, qx, qy, traffic, animals, scroll, spawnT, msg, msgT, score, time, particles, shake, hist, steeringSpeed, tr, rocks, arrivalOre, tons = 0, trip = 1;   // tons: total delivered to the Skyway; trip: 1 or 2
let ldr, carrying, spills = [];
let best = +localStorage.oreBest || 0;
let playerName = localStorage.oreName || '', runId = 0;
nameIn.value = playerName;
const DIFFS = [
  { n: 'EASY', spawn: 1.5, dmg: .6, vel: .85, mult: .7 },
  { n: 'NORMAL', spawn: 1, dmg: 1, vel: 1, mult: 1 },
  { n: 'HARD', spawn: .7, dmg: 1.4, vel: 1.15, mult: 1.5 },
  { n: 'KIDS', spawn: 5, dmg: .5, vel: .85, mult: .5, noWildlife: true }];
let diff = [0, 1, 2, 3].includes(+localStorage.oreDiff) && localStorage.oreDiff !== undefined ? +localStorage.oreDiff : 1;
const D = () => DIFFS[diff];
const diffBtn = i => [14 + i * 114, 516, 108, 38, DIFFS[i].n];
function setDiff(i) { diff = (i + DIFFS.length) % DIFFS.length; localStorage.oreDiff = diff; }
let board = [];
try { board = JSON.parse(localStorage.oreBoard || '[]'); } catch (e) { board = []; }
const reached = b => (b.tons ?? (b.done ? 1 : 0)) > 0;
const rank = (a, b) => (reached(b) - reached(a)) || (reached(a) ? ((b.tons ?? 0) - (a.tons ?? 0)) || b.score - a.score : b.pct - a.pct);
// runs that reached the Skyway rank by total tons hauled; runs wrecked before it rank by how far they got
const pctOut = () => tons > 0 ? 100 : Math.min(99, Math.floor(dist / TRIP * 100));
function recordRun(done) {
  if (runId) return;
  runId = Date.now();
  board.push({ id: runId, name: playerName || 'Player', done, diff, score: done ? score : 0, tons, pct: pctOut() });
  board.sort(rank); board = board.slice(0, 50);
  try { localStorage.oreBoard = JSON.stringify(board); } catch (e) {}
}
function drawBoard(y0, n, hi) {
  text('SCOREBOARD', W / 2, y0, 16, '#f60');
  if (!board.length) { text('No runs yet', W / 2, y0 + 30, 14, '#bbb'); return; }
  board.slice(0, n).forEach((b, i) => {
    const y = y0 + 28 + i * 24, c = b.id === hi ? '#ff6' : b.done ? '#fff' : '#bbb';
    text(`${i + 1}.`, 50, y, 15, c, 'left'); text(`${b.name} · ${(DIFFS[b.diff ?? 1].n)[0]}`, 80, y, 15, c, 'left');
    text(b.tons !== undefined ? (b.tons > 0 ? `${b.tons} t hauled` : `${b.pct}% to Skyway`) : b.done ? `${b.score} pts` : `${b.pct}% to Skyway`, W - 50, y, 15, c, 'right');
  });
}
const ore = () => Math.round(fills.reduce((a, b) => a + b, 0) * BUCKET);

function reset() { straddleT = 0;
  runId = 0;
  stickX = 0; tr = Array.from({ length: NT }, () => ({ lid: 0, want: 0, p: 0, dir: 0, hold: 0 })); rocks = []; arrivalOre = 0; tons = 0; trip = 1; fills = [0, 0, 0, 0]; hp = 100; dist = 0; speed = 0; steeringSpeed = 0; qx = LANE_X[0]; qy = 260; traffic = []; animals = [];
  scroll = 0; warned = 0; ret = false; hurtByStock = false; wk = null; spawnT = 0; msg = ''; msgT = 0; score = 0; time = 0; particles = []; shake = 0; hist = [{ s: 0, x: qx }]; train = { ph: 0, t: 0, g: 0, hit: false }; jts = straightChain(qx, qy, 1); cabAngle = 0;
  ldr = { x: 250, y: 600, angle: 0, art: 0 }; carrying = false; spills = []; ptrs.clear(); syncBtns();
}

function onKey(code) {
  if (state === 'drive' && code === 'KeyH' && hurtByStock) { toWorkshop(); return; }
  if (state === 'menu' && (code === 'ArrowLeft' || code === 'ArrowRight')) { setDiff(diff + (code === 'ArrowRight' ? 1 : -1)); return; }
  if (state === 'menu' && (code === 'Space' || code === 'Enter')) { playerName = nameIn.value.trim().slice(0, 12) || 'Player'; localStorage.oreName = playerName; nameIn.blur(); reset(); state = 'load'; flash('Scoop ore from the pile, dump it in the trailers'); return; }
  if (state === 'load') {
    if (code === 'Space') action();
    else if ((code === 'Enter' || code === 'KeyG') && ore() >= MIN_ORE) start();
    return;
  }
  if (state === 'skyway') {
    const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(code), t = ['KeyQ', 'KeyW', 'KeyE', 'KeyR'].indexOf(code);
    if (n >= 0) toggleLid(n); else if (t >= 0) tipTrailer(t);
    return;
  }
  if ((state === 'over' || state === 'win') && (code === 'Space' || code === 'Enter')) { reset(); state = 'menu'; }
}
function start() { state = 'drive'; ptrs.clear(); syncBtns(); flash('Steep hill ahead - watch your speed!'); }
function flash(t) { msg = t; msgT = 2.5; }
function burst(x, y, col, n) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 120, vy: (Math.random() - .8) * 120, l: .6, col }); }

const nearPile = () => ldr.x > PILE.x - 40 && ldr.x < PILE.x + PILE.w + 40 && ldr.y > PILE.y - 40 && ldr.y < PILE.y + PILE.h + 40;
const trailerAt = () => { const i = Math.floor((ldr.y - TR_Y0) / TR_H); return ldr.x > TR_X - 100 && i >= 0 && i < NT ? i : -1; };
function action() {
  if (!carrying) {
    if (nearPile()) { carrying = true; burst(ldr.x + Math.sin(ldr.angle + ldr.art) * 35, ldr.y - Math.cos(ldr.angle + ldr.art) * 35, '#8a5a44', 6); } else flash('Drive up to the ore pile to scoop');
  } else {
    const i = trailerAt();
    if (i < 0) flash('Line up beside a trailer to dump');
    else if (fills[i] >= TRAILER_CAP) flash(`Trailer ${i + 1} is full`);
    else {
      const fa = ldr.angle + ldr.art, cy = TR_Y0 + i * TR_H + TR_H / 2;
      const bx = ldr.x + Math.sin(fa) * 40, by = ldr.y - Math.cos(fa) * 40;
      const skew = Math.abs(Math.atan2(Math.sin(fa - Math.PI / 2), Math.cos(fa - Math.PI / 2)));
      const off = Math.abs(by - cy) / (TR_H / 2);
      const spill = Math.max(0, Math.min(1, Math.max((skew - .15) / .6, (off - .25) / .75)));
      fills[i] = Math.min(TRAILER_CAP, fills[i] + 1 - spill); carrying = false;
      burst(TR_X + TR_W / 2, cy, '#a8705a', Math.round(8 * (1 - spill)));
      if (spill > .05) {
        spills.push({ x: bx, y: by, r: 6 + spill * 16, a: Math.random() * 6 });
        burst(bx, by, '#8a5a44', Math.round(4 + spill * 10));
        flash(spill > .95 ? 'Missed the trailer! All spilled' : `Not square: ${Math.round(spill * BUCKET)}t spilled on the ground`);
      }
    }
  }
}

function spawn() {
  if (D().noWildlife || Math.random() < .6) {
    const lane = Math.floor(Math.random() * LANE_X.length), oncoming = lane === 1;
    const col = ['#c33', '#36c', '#ccc', '#e8b100', '#3a3'][Math.floor(Math.random() * 5)];
    const truck = Math.random() < .25;
    traffic.push({ x: LANE_X[lane], lx: LANE_X[lane], y: -100, w: 34, h: truck ? 90 : 56, v: (oncoming ? -110 : 40 + Math.random() * 40) * D().vel, col, truck, oncoming });
  } else {
    const dir = Math.random() < .5 ? 1 : -1;
    animals.push({ x: (dir > 0 ? ROAD_L - 40 : ROAD_R + 40) + roadAt(scroll + qy + 40), y: -40, dir, w: 44, h: 28, type: Math.random() < .5 ? 'cow' : 'roo', col: Math.random() < .5 ? '#1e1e1e' : '#6b3e1f', vx: (35 + Math.random() * 25) * D().vel, ph: 0 });
  }
}

const SKY_X = 190, EDGE_X = 250;
const lidBtn = i => [6, qy + OFF(i) - 28, 112, 26, tr[i].want ? 'CLOSE LID' : 'OPEN LID'];
const tipBtn = i => [6, qy + OFF(i) + 2, 112, 26, 'TIP BIN'];
function toggleLid(i) { const t = tr[i]; if (t.dir || t.p > 0 || t.hold > 0) return; t.want = 1 - t.want; }
function tipTrailer(i) {
  const t = tr[i]; if (t.dir || t.p > 0 || t.hold > 0) return;
  if (t.lid < .95) flash(`Open trailer ${i + 1}'s lid first`);
  else if (fills[i] <= 0) flash(`Trailer ${i + 1} is empty`);
  else t.dir = 1;
}
const hit = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 - 3 && Math.abs(a.y - b.y) < (a.h + b.h) / 2 - 3;
// Articulated chain: joints[0] is the cab's hitch; each following joint is dragged to stay `len` behind the one in front,
// so every trailer pivots on the joint shared with the unit ahead of it.
function chainFollow(J, len) {
  for (let i = 0; i < J.length - 1; i++) {
    let dx = J[i].x - J[i + 1].x, dy = J[i].y - J[i + 1].y;
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    J[i + 1].x = J[i].x - dx * len; J[i + 1].y = J[i].y - dy * len;
  }
}
// pose (centre + heading) of the trailer between joints i and i+1
function chainPose(J, i) {
  const a = J[i], b = J[i + 1];
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, a: Math.atan2(a.x - b.x, -(a.y - b.y)) };
}
const TRAILER_LEN = 62, HITCH = 26;   // joint-to-joint trailer length and cab hitch distance behind the cab centre
const straightChain = (x, y, sc) => Array.from({ length: NT + 1 }, (_, k) => ({ x, y: y + (HITCH + TRAILER_LEN * k) * sc }));
let cabAngle = 0, jts;
// level crossing 10% of the trip before the steep climb; an ore train sweeps across left to right
const CROSS_S = TRIP * 4 - CLIMB - TRIP * .4, TRAIN_L = 900, TRAIN_V = 280, TRAIN_X0 = ROAD_L - TRAIN_V * 4, CROSS_R = 460;
let train = { ph: 0, t: 0, g: 0, hit: false };   // ph: 0 waiting, 1 coming/passing, 2 gone; g: gate lowering 0..1
const crossAt = () => ret ? R - CROSS_S : CROSS_S;
const crossY = () => scroll + qy - crossAt();
const trainHead = () => TRAIN_X0 + TRAIN_V * train.t;
const trainClear = () => trainHead() - TRAIN_L > ROAD_R + 40;
const trainBlocks = () => train.ph === 1 && !trainClear();
function updateTrain(dt, parts) {
  const ahead = crossAt() - scroll;
  if (train.ph === 0 && ahead < CROSS_R * 2 && ahead > 0) { train.ph = 1; train.t = 0; flash('Train coming! Stop at the crossing'); }
  if (train.ph === 1) {
    train.t += dt;
    if (trainHead() - TRAIN_L > W + 40) train.ph = 2;
    else if (!train.hit && parts.some(p => hit(p, { x: trainHead() - TRAIN_L / 2, y: crossY(), w: TRAIN_L, h: 30 }))) {
      train.hit = true; damage(1000, 'Smashed by the train!', -1); speed = 0;
    }
  }
  train.g = Math.max(0, Math.min(1, train.g + (trainBlocks() ? 1 : -1) * dt * 1.2));
  const cy = crossY(), hold = trainBlocks();
  for (const t of traffic) {
    if (t.oncoming) continue;
    t.v0 ??= t.v;
    t.v = hold && t.y > cy && t.y - cy < 110 ? 0 : t.v0;   // queue up behind the gates
  }
}
reset();

function damage(n, what, idx) {
  n = Math.round(n * D().dmg); hp -= n; shake = .3; flash(what);
  if (idx >= 0) fills[idx] = Math.max(0, Math.round(fills[idx] * .6 - .2)); else for (let i = 0; i < NT; i++) fills[i] = Math.max(0, fills[i] - (Math.random() < .3 ? 1 : 0));
  burst(qx, qy + (idx >= 0 ? OFF(idx) : 0), '#8a5a44', 10);
  if (hp <= 0) { hp = 0; state = 'over'; recordRun(false); }
}

function updateLoad(dt) {
  const steering = steerAxis();
  const throttle = (keys.ArrowUp || keys.KeyW || keys.TU ? 1 : 0) - (keys.ArrowDown || keys.KeyS || keys.TD ? 1 : 0);
  ldr.art += (steering * .6 - ldr.art) * (1 - Math.exp(-6 * dt));
  const distance = throttle * (carrying ? 120 : 160) * dt;
  const mid = ldr.angle + ldr.art / 2;
  ldr.angle += distance * Math.sin(ldr.art) / 40; // rear section swings round the centre joint
  ldr.x = Math.max(25, Math.min(W - 25, ldr.x + Math.sin(mid) * distance));
  ldr.y = Math.max(85, Math.min(H - 100, ldr.y - Math.cos(mid) * distance));
  if (ldr.x > TR_X - 36 && ldr.y < TR_Y0 + NT * TR_H + 20) ldr.x = TR_X - 36; // trailers block the way
  // push the loader out of the pile along the shallowest axis
  const px = ldr.x - (PILE.x + PILE.w / 2), py = ldr.y - (PILE.y + PILE.h / 2), ox = PILE.w / 2 + LDR_R - Math.abs(px), oy = PILE.h / 2 + LDR_R - Math.abs(py);
  if (ox > 0 && oy > 0) { if (ox < oy) ldr.x += Math.sign(px || 1) * ox; else ldr.y += Math.sign(py || 1) * oy; }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.l -= dt; }
  particles = particles.filter(p => p.l > 0); msgT -= dt;
}

function updateSkyway(dt) {
  for (let i = 0; i < NT; i++) {
    const t = tr[i], y = qy + OFF(i);
    t.lid += Math.sign(t.want - t.lid) * Math.min(Math.abs(t.want - t.lid), dt * 2.5);
    if (t.dir === 1) {
      t.p += dt / 1.2;
      if (fills[i] > 0) for (let k = 0; k < 2; k++) rocks.push({ x: SKY_X + 14, y: y + (Math.random() - .5) * 40, vx: 60 + Math.random() * 90, vy: (Math.random() - .5) * 30, l: 1.4, c: Math.random() < .5 ? '#8a5a44' : '#a8705a' });
      if (t.p >= 1) { t.p = 1; t.dir = 0; t.hold = .7; fills[i] = 0; }
    } else if (t.hold > 0) { t.hold -= dt; if (t.hold <= 0) t.dir = -1; }
    else if (t.dir === -1) { t.p -= dt / 1.2; if (t.p <= 0) { t.p = 0; t.dir = 0; } }
  }
  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.l -= dt; }
  rocks = rocks.filter(r => r.l > 0); msgT -= dt;
  if (state === 'skyway' && fills.every(f => f <= 0) && tr.every(t => t.dir === 0 && t.p === 0 && t.hold <= 0)) {
    startReturn();
  }
}
function startSecondLoad() {

  ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
}
// jagged rock chunks scattered over an ellipse; deterministic so they don't flicker
function rockChunks(cx, cy, rx, ry, n, size, seed = 1) {
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cols = ['#5e3a2c', '#7a4a38', '#8a5a44', '#a8705a', '#b98368'];
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, d = Math.sqrt(rnd()), x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d, r = size * (.5 + rnd());
    const k = 5 + Math.floor(rnd() * 3), rot = rnd() * 6.283;
    ctx.fillStyle = cols[Math.floor(rnd() * cols.length)]; ctx.beginPath();
    for (let j = 0; j < k; j++) { const t = rot + j / k * 6.283, rr = r * (.6 + rnd() * .5); ctx[j ? 'lineTo' : 'moveTo'](x + Math.cos(t) * rr, y + Math.sin(t) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff22'; ctx.fillRect(x - r * .3, y - r * .4, r * .4, r * .25);
  }
}
function drawYard() {
  rect(0, 0, W, H, '#a74626');
  for (let i = 0; i < 30; i++) rect((i * 97) % W, (i * 61) % H, 6, 6, '#85371f');
  const pcx = PILE.x + PILE.w / 2, pcy = PILE.y + PILE.h / 2;
  const finger = (x, y, w, h) => { const r = w / 2; ctx.beginPath(); ctx.arc(x + r, y + r, r, Math.PI, 0); ctx.arc(x + r, y + h - r, r, 0, Math.PI); ctx.closePath(); ctx.fill(); };
  ctx.fillStyle = '#5a3426'; finger(PILE.x - 6, PILE.y + 6, PILE.w + 12, PILE.h + 4);
  ctx.fillStyle = '#7a4a38'; finger(PILE.x, PILE.y, PILE.w, PILE.h);
  ctx.fillStyle = '#9a6a55'; finger(PILE.x + 16, PILE.y + 14, PILE.w - 32, PILE.h - 40);
  rockChunks(pcx, pcy, PILE.w / 2 - 6, PILE.h / 2 - 8, 170, 8, 7);
  ctx.save(); ctx.translate(pcx, pcy); ctx.rotate(-Math.PI / 2); text('IRON ORE', 0, 5, 18, '#fff'); ctx.restore();
  drawCab(TR_X + TR_W / 2 - 1, TR_Y0 - 38);
  for (let i = 0; i < NT; i++) {
    const cy = TR_Y0 + i * TR_H + TR_H / 2;
    rect(TR_X + TR_W / 2 - 3, cy - TR_H / 2 - 12, 6, 12, '#444');
    drawTrailer(TR_X + TR_W / 2, cy, TR_W, TR_H - 14, fills[i] / TRAILER_CAP, i + 1);
    text(`${Math.round(fills[i] * BUCKET)}/${TRAILER_CAP * BUCKET}t`, TR_X + TR_W / 2, cy + 6, 13, '#fff');
    if (trailerAt() === i && carrying) { ctx.strokeStyle = '#ff6'; ctx.lineWidth = 3; ctx.strokeRect(TR_X - 2, cy - TR_H / 2 + 5, TR_W + 4, TR_H - 10); }
  }
  for (const p of spills) {
    ctx.fillStyle = '#8a5a44'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * .7, p.a, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a8705a'; ctx.beginPath(); ctx.ellipse(p.x - 2, p.y - 2, p.r * .55, p.r * .35, p.a, 0, Math.PI * 2); ctx.fill();
    rockChunks(p.x, p.y, p.r, p.r * .7, Math.round(p.r / 2) + 2, 3.5, Math.round(p.a * 100) + 1);
  }
  drawLoader(ldr.x, ldr.y, carrying);
  for (const p of particles) rect(p.x, p.y, 4, 4, p.col);
  rect(0, 0, W, 56, '#000a');
  text('FRONT-END LOADER', 12, 24, 18, '#f2b200', 'left');
  text(`Loaded: ${ore()} / ${MAX_ORE} t`, 12, 46, 13, '#ddd', 'left');
  text(carrying ? 'Bucket full: dump it in a trailer' : nearPile() ? 'At the pile: SCOOP' : 'Drive to the pile', W - 12, 24, 13, '#ff6', 'right');
  text(isTouch ? 'Stick to steer · GAS / REV to move' : '←→ / pad stick turn · ↑↓ move · SPACE scoop/dump', W - 12, 46, 12, '#ccc', 'right');
  if (msgT > 0) text(msg, W / 2, 90, 15, '#ff6');
  if (ore() >= MIN_ORE) { if (isTouch) drawBtn(GO, GO[4], false); else text('Press G / Enter to start driving', W / 2, 620, 18, '#ff6'); }
  else text(`Load at least ${MIN_ORE} t to depart`, W / 2, isTouch ? 615 : 620, 14, '#bbb');
  if (isTouch) { drawStick(); drawBtns(LB); drawBtn(ACT, ACT[4], false); }
}

function tyreDisc(x, y, r, spin = 0) {
  ctx.fillStyle = '#0d0d0d'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a8d90'; ctx.beginPath(); ctx.arc(x, y, r * .55, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let k = 0; k < 4; k++) { const a = spin + k * Math.PI / 2; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .5); }
  ctx.stroke();
}
// top-down mechanic facing "up" before rotation: boots, shoulders, reaching arms, hard hat
function drawMech(m) {
  const t = performance.now() / 1000, sw = m.walk ? Math.sin(t * 10 + m.ph) : 0, reach = m.work ? 7 + Math.sin(t * 16 + m.ph) * 2 : 3 + sw * 1.5;
  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.a); ctx.scale(1.3, 1.3);
  rect(-4, -1 + sw * 3, 3, 5, '#222'); rect(1, -1 - sw * 3, 3, 5, '#222');
  ctx.fillStyle = m.col; ctx.beginPath(); ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = m.col; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(-5, 0); ctx.lineTo(-4, -reach); ctx.moveTo(5, 0); ctx.lineTo(4, -reach * .9); ctx.stroke(); ctx.lineCap = 'butt';
  if (m.work) rect(-6, -reach - 5, 3, 7, '#b8bcc0');
  ctx.fillStyle = '#e0b090'; ctx.beginPath(); ctx.arc(0, -1, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f2c200'; ctx.beginPath(); ctx.arc(0, -1.5, 3.6, Math.PI, 0); ctx.fill();
  ctx.restore();
}
function drawUte(u) {
  ctx.save(); ctx.translate(u.x, u.y); ctx.rotate(u.h);
  for (const sx of [-8.5, 8.5]) for (const wy of [-10, 9]) rect(sx - 1.5, wy - 4, 3, 8, '#111');
  rect(-8, -17, 16, 34, '#f4f4f4'); rect(-8, -17, 16, 2, '#ddd');
  rect(-6, -11, 12, 7, '#9cf'); rect(-6, -3, 12, 7, '#e6e6e6');
  rect(-7, 6, 14, 10, '#cfcfcf'); rect(-6, 7, 12, 8, '#a9a9a9');
  rect(-7, -17, 3, 2, '#ffe9a0'); rect(4, -17, 3, 2, '#ffe9a0'); rect(-7, 15, 3, 2, '#d33'); rect(4, 15, 3, 2, '#d33');
  if (Math.sin(beaconClock() * 10) > 0) rect(-2, -2, 4, 3, '#ffa020');
  ctx.restore();
}
function drawYardLife() {
  for (const r of yard.parked) drawRig(r.j, r.x, r.y, r.h, WK_SC, { fill: r.f });
  for (const r of yard.movers) { if (r.ute) drawUte(r); else drawRig(r.j, r.x, r.y, r.h, WK_SC, { fill: r.f }); }
  for (const m of yard.mechs) drawMech(m);
  // new tyres on a rack and a heap of old ones outside the tyre bay
  for (let k = 0; k < 3; k++) tyreDisc(TY_RACK.x, TY_RACK.y - k * 3, 9);
  for (let k = 0; k < 3 + wk.fit.piled; k++) tyreDisc(TY_SCRAP.x + ((k * 7) % 13) - 6, TY_SCRAP.y + ((k * 5) % 11) - 5 - Math.floor(k / 4) * 3, 8);
}
function drawStructures() {
  for (const c of CONT) {
    rect(c.x + 3, c.y + 3, c.w, c.h, '#0004'); rect(c.x, c.y, c.w, c.h, c.c);
    for (let k = 4; k < c.w - 3; k += 5) rect(c.x + k, c.y + 3, 1.5, c.h - 6, '#0003');
    rect(c.x, c.y, c.w, 4, '#0005'); rect(c.x, c.y + c.h - 6, c.w, 6, '#0006');
    rect(c.x + c.w / 2 - 1, c.y + c.h - 40, 2, 34, '#ddd8');
  }
  const h = SHELTER;   // corrugated arch seen from above: ribs across, shaded towards the sides
  rect(h.x + 3, h.y + 3, h.w, h.h, '#0004');
  const g = ctx.createLinearGradient(h.x, 0, h.x + h.w, 0);
  g.addColorStop(0, '#8d959c'); g.addColorStop(.5, '#e4e8eb'); g.addColorStop(1, '#8d959c');
  ctx.fillStyle = g; ctx.fillRect(h.x, h.y, h.w, h.h);
  for (let y = h.y + 8; y < h.y + h.h; y += 12) rect(h.x, y, h.w, 1.5, '#6c747b');
  rect(h.x, h.y, h.w, 5, '#5a6168'); rect(h.x, h.y + h.h - 5, h.w, 5, '#5a6168');
}
function drawFitter() {
  const f = wk.fit, idle = f.u < 0 && !wk.auto, bx = wkBayX(TYRE_BAY);
  if (idle) tyreDisc(f.fx + 20, f.fy, 10, performance.now() / 150);
  drawMech({ x: f.fx, y: f.fy, a: f.fa, col: '#d83a3a', walk: f.walk, work: idle || (wk.auto && !f.walk && f.u >= 0 && f.u <= NT && (f.stage === 1 || f.stage === 2)), ph: 0 });
  for (const r of f.rolls) {
    ctx.save(); ctx.translate(r.x, r.y);
    rect(-5.5, -2.5, 11, 5, r.kind === 'new' ? '#050505' : '#3d3835');
    rect(-5.5 + (r.a * 2) % 11, -2.5, 1.2, 5, '#777');
    ctx.restore();
  }
}
function drawWorkshop() {
  const cx0 = Math.max(0, Math.min(WORLD.w - W, wk.x - W / 2)), cy0 = Math.max(0, Math.min(WORLD.h - H, wk.y - H / 2));
  ctx.save(); ctx.translate(-Math.round(cx0), -Math.round(cy0));
  rect(0, 0, WORLD.w, WORLD.h, '#a74626');
  for (let i = 0; i < 160; i++) rect((i * 97) % WORLD.w, (i * 61) % WORLD.h, 6, 6, '#85371f');
  ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 10; ctx.setLineDash([24, 12]); ctx.strokeRect(5, 5, WORLD.w - 10, WORLD.h - 10); ctx.setLineDash([]);
  rect(GATE.x - GATE.w / 2, WORLD.h - 12, GATE.w, 12, '#a74626');
  rect(GATE.x - GATE.w / 2 - 6, WORLD.h - 40, 6, 40, '#e8b100'); rect(GATE.x + GATE.w / 2, WORLD.h - 40, 6, 40, '#e8b100');
  text(wk.done ? 'EXIT ▼' : 'ENTRY / EXIT', GATE.x, WORLD.h - 50, 14, wk.done ? '#6f6' : '#ffd23a');
  rect(WK.x - 6, WK.y - 6, WK.w + 12, WK.h + 12, '#3b3f44');
  for (let i = 0; i < 6; i++) {
    const x = WK.x + i * BAY_W;
    rect(x + 1, WK.y, BAY_W - 2, WK.h, '#2a2d30');
    rect(x + 3, WK.y + 4, 3, WK.h - 8, '#e8b100'); rect(x + BAY_W - 6, WK.y + 4, 3, WK.h - 8, '#e8b100');
  }
  const al = wk.lap === 15 && !wk.auto && !wk.done ? wkAlign() : null;
  for (let i = 0; i < 6; i++) {
    const cx = wkBayX(i), on = al && al.i === i && wk.y < WK.y + 20;
    ctx.strokeStyle = on ? (al.ok ? '#6f6' : '#f66') : 'rgba(255,255,255,.35)'; ctx.lineWidth = on ? 3 : 2; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(cx, WK.y - 4); ctx.lineTo(cx, WK.y - 500); ctx.stroke(); ctx.setLineDash([]);
    text(String(i + 1), cx, WK.y - 14, 14, '#fff');
  }
  if (!wk.done) for (const [k, x, y] of [[1, 960, WK.y + WK.h / 2], [2, WK.x + WK.w / 2, 330]]) {
    ctx.fillStyle = wk.lap & k ? 'rgba(80,220,80,.5)' : 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill();
  }
  drawStructures();
  drawYardLife();
  const tb = wkBayX(TYRE_BAY);
  for (const x of [tb - 11, tb + 11]) { tyreDisc(x, WK_MOUTH - 14, 7); tyreDisc(x, WK_MOUTH - 17, 7); }
  drawRig(wk.j, wk.x, wk.y, wk.h, WK_SC, wk.auto && wk.bay === TYRE_BAY ? { tyre: wk.fit.st } : null);
  drawFitter();
  for (const m of wk.crew) drawMech(m);
  rect(WK.x - 6, WK_MOUTH, WK.w + 12, 6, '#3b3f44');
  ctx.fillStyle = 'rgba(95,105,115,.5)'; ctx.fillRect(WK.x, WK.y, WK.w, WK.h);
  text('WORKSHOP', WK.x + WK.w / 2, WK.y + WK.h / 2 + 6, 22, '#fff');
  rect(tb - 24, WK_MOUTH + 8, 48, 16, '#222'); text('TYRES', tb, WK_MOUTH + 20, 12, '#ffd23a');
  text('TYRES', tb, WK.y - 30, 10, '#ffd23a');
  for (const p of particles) rect(p.x, p.y, 4, 4, p.col);
  ctx.restore();
  rect(0, 0, W, 64, '#000a');
  text('HP', 10, 20, 12, '#fff', 'left'); bar(34, 8, 140, 16, hp / 100, hp > 40 ? '#4c4' : '#e44');
  text('WORKSHOP YARD', W - 10, 22, 16, '#ff6', 'right');
  text(wk.auto && !wk.done ? (wk.bay === TYRE_BAY ? 'Fitting new tyres...' : wk.crewReady ? 'Repairing...' : 'Mechanics coming over...') : wk.done ? 'Drive out through the yard gate' : wk.lap === 15 ? 'Straight in line with a bay, then drive in' : 'Up the right side, round to the top of the workshop', W / 2, 52, 14, '#ddd');
  if (msgT > 0) text(msg, W / 2, 110, 18, '#ff6');
  if (isTouch) { drawStick(); drawBtns(DB); }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  if (state === 'workshop') drawWorkshop();
  else if (state === 'load') drawYard();
  else if (state === 'menu') {
    drawRoad();
    drawCab(W / 2, 360); for (let i = 0; i < NT; i++) drawTrailer(W / 2, 360 + OFF(i), 34, 56, .8, 0, 0);
    rect(40, 70, W - 80, 180, '#000b'); rect(40, 316, W - 80, 190, '#000b');
    drawBoard(344, 5, 0);
    for (let i = 0; i < DIFFS.length; i++) { const b = diffBtn(i); rect(b[0], b[1], b[2], b[3], i === diff ? '#f60' : '#000b'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(b[0], b[1], b[2], b[3]); text(b[4], b[0] + b[2] / 2, b[1] + 25, 16); }
    text("LET'S HAUL", W / 2, 130, 44, '#f60');
    text('Haul some dirt, dodge the wildlife, chase some tons', W / 2, 175, 14, '#ddd');
    text(isTouch ? 'Tap to start' : 'Press SPACE to start', W / 2, 580, 22, '#ff6');
    text('←→ difficulty (menu) · ↑/W throttle  ↓/S brake  ←→/A D steer', W / 2, 620, 14, '#ccc');
    text(`Best: ${best}`, W / 2, 650, 14, '#ccc');
  } else {
    if (state === 'skyway') drawSkyway();
    else {
      drawRoad(); drawRom(); drawTrack();
      for (const a of animals) drawAnimal(a);
      for (const t of traffic) drawCar(t);
      drawTruck(); drawTrain();
      for (const p of particles) rect(p.x, p.y, 4, 4, p.col);
    }
    rect(0, 0, W, 64, '#000a');
    text('HP', 10, 20, 12, '#fff', 'left'); bar(34, 8, 140, 16, hp / 100, hp > 40 ? '#4c4' : '#e44');
    text('ORE', 10, 48, 12, '#fff', 'left'); bar(40, 36, 134, 16, ore() / MAX_ORE, '#c86');
    if (state === 'drive' || state === 'over') {
      text(`TRIP ${trip}/2`, W / 2, 22, 14, '#ccc');
      text(`${Math.round(speed * .5)} km/h`, W - 10, 22, 16, '#fff', 'right');
      text(`${Math.min(100, Math.round(dist / TRIP * 100))}% ${ret ? 'back to the ROM' : 'to the Skyway'}`, W - 10, 48, 14, '#ff6', 'right');
    } else text(state === 'win' ? 'THE ROM' : 'THE SKYWAY', W - 10, 30, 18, '#ff6', 'right');
    if (isTouch && state === 'drive') { drawStick(); drawBtns(DB); }
    if (state === 'drive' && hurtByStock) drawBtn(WS_BTN, isTouch ? 'WORKSHOP' : 'WORKSHOP (H)', false);
    if (state === 'drive' && grade() === -2) text('▲ STEEP CLIMB', W - 10, 88, 15, '#f90', 'right');
    else if (state === 'drive' && grade() === 2) text('▼ STEEP DESCENT', W - 10, 88, 15, '#f90', 'right');
    if (state === 'drive' && trainBlocks() && crossY() < qy + 150 && Math.sin(beaconClock() * 8) > -.3) text('TRAIN CROSSING - STOP!', W / 2, 150, 20, '#f44');
    if (msgT > 0) text(msg, W / 2, 110, 22, '#ff6');
    if (state === 'over' || state === 'win') {
      rect(30, 120, W - 60, 500, '#000d');
      if (state === 'over') { text('WRECKED!', W / 2, 175, 38, '#e44'); text(tons > 0 ? `${tons} t hauled to the Skyway` : `${pctOut()}% of the way to the Skyway`, W / 2, 208, 17); }
      else {
        text('DELIVERED!', W / 2, 175, 38, '#4c4');
        text(`${D().n}: ${tons} t hauled in 2 trips, ${Math.round(time)}s`, W / 2, 205, 15);
        text(`Score: ${score}`, W / 2, 238, 24, '#ff6');
      }
      drawBoard(285, 10, runId);
      text(isTouch ? 'Tap to play again' : 'Press SPACE to play again', W / 2, 590, 18, '#ff6');
    }
  }
  ctx.restore();
}

let last = performance.now();
function placeName() {
  const show = state === 'menu', r = cv.getBoundingClientRect(), k = r.width / W;
  nameIn.style.display = show ? 'block' : 'none';
  if (!show) return;
  Object.assign(nameIn.style, { left: r.left + (W / 2 - 120) * k + 'px', top: r.top + 262 * k + 'px', width: 240 * k + 'px', height: 38 * k + 'px', fontSize: 18 * k + 'px' });
}
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(); placeName(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
